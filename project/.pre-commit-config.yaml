repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: 'configs/_examples/.*\.yaml$'  # Allow examples but check main config
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      
  # Custom hook to prevent new yaml files in root or configs/ (except _examples/)
  - repo: local
    hooks:
      - id: check-single-config
        name: Check single config.yaml policy
        entry: bash -c 'if ls *.yaml 2>/dev/null | grep -v "^config.yaml$" | grep -v "^\.pre-commit-config\.yaml$"; then echo "ERROR: Only config.yaml allowed in root!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "--line-length", "88"]

  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length", "88"]

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--ignore=E203,W503,E501"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: ["--ignore-missing-imports", "--strict-optional"]
        exclude: ^(tests/|third_party/|experiments/)

default_language_version:
  python: python3

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false